<div class="ViewContainer">
  <main class="AuthCard MfaCard">
    <div class="CardHeader">
      <h2>{{ 'MfaSetup.Title' |translate}}</h2>
      <p>{{ 'MfaSetup.SubTitle' |translate}}</p>
    </div>

    <div class="MfaGrid">
      <div class="Instructions">
        <ol>
          <li>{{ 'MfaSetup.step1' |translate}}</li>
          <li>{{ 'MfaSetup.step2' |translate}}</li>
          <li>{{ 'MfaSetup.step3' |translate}}</li>
          <li>{{ 'MfaSetup.step4' |translate}}</li>
        </ol>
      </div>

      <div class="QrSection">
        <div class="QrWrapper">
          <qrcode 
            [qrdata]="QrImageUrl()" 
            [width]="180" 
            [errorCorrectionLevel]="'M'">
          </qrcode>
        </div>

        <div class="ValidationGroup">
          <input 
            type="text" 
            maxlength="6" 
            placeholder="000000"
            [(ngModel)]="VerificationCode"
            class="AnswerInput CodeInput"
          />
          <button 
            class="PrimaryButton" 
            (click)="VerifySetup()" 
            [disabled]="IsLoading() || VerificationCode().length !== 6">
            {{ 'MfaSetup.Valide' |translate}}
          </button>
        </div>
      </div>
    </div>

    <div class="CardFooter" style="margin-top: 1.5rem;">
      <button 
        class="SecondaryButton" 
        (click)="GoBack()" 
        [disabled]="IsLoading()">
        {{ 'GENERAL.Back' |translate}}
      </button>
    </div>
    </main>
</div>
