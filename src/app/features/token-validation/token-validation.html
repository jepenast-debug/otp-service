<div class="ViewContainer">
  <app-stepper [CurrentStep]="4"></app-stepper>

  <main class="AuthCard">
    <div class="CardHeader">
      <h2>Validación de Código</h2>
      <p>Hemos enviado un código de 6 dígitos al método seleccionado. Ingréselo a continuación.</p>
    </div>

    <div class="CardBody">
      <div class="ValidationBoxes">
        @for (digit of CodeDigits(); track $index) {
          <input 
            #digitInput
            type="text" 
            maxlength="1" 
            [value]="digit"
            (input)="OnInput($event, $index)"
            (keydown)="OnKeyDown($event, $index)"
            (paste)="OnPaste($event, $index)"
            class="DigitBox"
            [class.Error]="ErrorMessage() || IsExpired()"
            [disabled]="IsLoading() || IsExpired()"
          />
        }
      </div>

      @if (ErrorMessage()) {
        <div class="ErrorAlert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <span>{{ ErrorMessage() }}</span>
        </div>
      }

      <div class="TimerSection">
        @if (IsExpired()) {
          <span class="ExpiredText">El tiempo ha expirado.</span>
        } @else {
          <span class="TimerText">Tiempo restante: {{ FormattedTime() }}</span>
        }
        
        <button class="LinkButton" (click)="ResendCode()" [disabled]="IsLoading()">
          Reenviar Código
        </button>
      </div>
    </div>

    <div class="CardFooter">
      <button 
        class="PrimaryButton" 
        (click)="ValidateToken()" 
        [disabled]="!IsFormValid() || IsLoading() || IsExpired()">
        
        @if (IsLoading()) {
          <span class="Spinner"></span>
        } @else {
          Autenticar
        }
      </button>
      
      <button 
        class="SecondaryButton" 
        (click)="GoBack()" 
        [disabled]="IsLoading()">
        Volver
      </button>
    </div>
  </main>
</div>
